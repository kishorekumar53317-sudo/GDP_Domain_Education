<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | EduGuide-AI - Create Account</title>
    <meta name="description" content="Create a free EduGuide-AI account to unlock your personalized 24/7 AI tutor and interactive learning tools.">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

<div class="auth-container">
    <div class="auth-card">
        <a href="index.html" class="logo auth-logo">
            <div class="logo-icon">🎓</div>
            EduGuide<span>-AI</span>
        </a>

        <h1>Create Account</h1>
        <p class="auth-description">
            Start your smarter learning journey in under 30 seconds.
        </p>

        <form id="signupForm">
            <div class="form-group">
                <label for="signupName">Full Name</label>
                <input
                    type="text"
                    id="signupName"
                    placeholder="Alex Morgan"
                    required
                >
            </div>

            <div class="form-group">
                <label for="signupEmail">Email Address</label>
                <input
                    type="email"
                    id="signupEmail"
                    placeholder="student@university.edu"
                    required
                >
            </div>

            <div class="form-group">
                <label for="signupPassword">Password</label>
                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a strong password"
                    required
                >
            </div>

            <button type="submit" class="auth-btn" id="signupSubmitBtn">
                Create Free Account
            </button>
        </form>

        <p id="signupMessage"></p>

        <p class="auth-switch">
            Already have an account?
            <a href="login.html">Sign In</a>
        </p>

        <a href="index.html" class="back-home">
            ← Return to Home Page
        </a>
    </div>
</div>

<script src="theme.js"></script>
<script type="module" src="auth.js"></script>
</body>
</html>
